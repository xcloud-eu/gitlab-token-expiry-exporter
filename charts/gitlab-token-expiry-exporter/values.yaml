# Default values for gitlab-token-expiry-exporter.

gitlab:
  # Base URL of your GitLab instance.
  url: https://gitlab.com
  # Group paths to scan; each group, its subgroups and their projects are covered.
  # The token's reach scopes the scan: a group access token sees only its own group.
  groups: []
  #  - my-org/infrastructure
  # How to provide the read token (scopes: read_api; role: owner on the groups).
  # Default (nothing set): the chart references a Secret named after the release
  # (helm status shows the exact name) with key GITLAB_READ_TOKEN — create it with
  # whatever you use for secrets (external-secrets, sealed-secrets, kubectl) and
  # you're done, no values needed here.
  # existingSecret: reference a Secret under a different name instead;
  # existingSecretKey is the key within it that holds the token.
  existingSecret: ""
  existingSecretKey: GITLAB_READ_TOKEN
  # Option 2: plain token, rendered into a chart-managed Secret. Quick starts only;
  # anyone with access to your values sees it.
  token: ""

# Hours between scans (clamped to 0.25-168 by the exporter; tokens expire daily,
# so there is little point going below a few hours).
refreshHours: 4

image:
  repository: ghcr.io/xcloud-eu/gitlab-token-expiry-exporter
  # The image released and tested with this chart version; override to pin another.
  tag: "0.2.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

serviceMonitor:
  # Requires the Prometheus Operator ServiceMonitor CRD.
  enabled: true
  interval: 2m
  # Match your Prometheus serviceMonitorSelector, e.g. release: kube-prometheus-stack
  additionalLabels: {}

prometheusRule:
  # Ship the bundled alert rules (requires the PrometheusRule CRD).
  enabled: true
  # Match your Prometheus ruleSelector.
  additionalLabels: {}
  # Days of remaining validity below which GitLabTokenExpiringSoon fires.
  expiringSoonDays: 14
  # Seconds without a successful scan before GitLabTokensExporterStale fires.
  # Keep comfortably above refreshHours.
  staleAfterSeconds: 21600
  # Labels added to every alert (e.g. team: platform).
  alertLabels:
    severity: warning
  # Toggle individual bundled alerts off without losing the rest.
  rules:
    tokenExpiringSoon: true
    tokenExpired: true
    scanErrors: true
    stale: true
    absent: true
  # Extra alert rules appended verbatim to the bundled group (PrometheusRule
  # rule syntax). alertLabels are NOT applied here — set labels explicitly.
  additionalRules: []
  #  - alert: GitLabTokenExpiredCritical
  #    expr: gitlab_token_days_remaining{active="true"} < 3
  #    for: 15m
  #    labels:
  #      severity: critical

dashboard:
  # Ship the Grafana dashboard as a ConfigMap for the grafana sidecar to pick up.
  enabled: true
  # Label the sidecar watches for.
  sidecarLabel: grafana_dashboard
  sidecarLabelValue: "1"
  # Set to place the dashboard in a folder (needs sidecar folderAnnotation support).
  folderAnnotation: ""
  folder: ""

service:
  port: 9184

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Extra environment variables for the exporter container.
extraEnv: []
