{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gte.fullname" . }}-dashboard
  labels:
    {{- include "gte.labels" . | nindent 4 }}
    {{ .Values.dashboard.sidecarLabel }}: {{ .Values.dashboard.sidecarLabelValue | quote }}
  {{- if and .Values.dashboard.folderAnnotation .Values.dashboard.folder }}
  annotations:
    {{ .Values.dashboard.folderAnnotation }}: {{ .Values.dashboard.folder | quote }}
  {{- end }}
data:
  gitlab-token-expiry.json: |-
{{ .Files.Get "dashboards/gitlab-token-expiry.json" | indent 4 }}
{{- end }}
