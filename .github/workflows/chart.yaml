name: chart
on:
  push:
    branches: [main]
    paths: ["charts/**"]
  pull_request:
    paths: ["charts/**"]
permissions:
  contents: write
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/gitlab-token-expiry-exporter
      - run: |
          helm template t charts/gitlab-token-expiry-exporter \
            --set gitlab.groups={my-org} --set gitlab.existingSecret=s >/dev/null
  # OCI release to GHCR: works while the repo is private; a Pages-based classic
  # helm repo (chart-releaser) can be added when the repo goes public.
  release:
    if: github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Push chart to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package charts/gitlab-token-expiry-exporter -d /tmp/pkg
          helm push /tmp/pkg/*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
