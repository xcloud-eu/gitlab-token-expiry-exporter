# Example: feed the exporter's token from a GitLab CI/CD variable via
# external-secrets (any SecretStore that yields a Secret works the same way).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-token-expiry-exporter
spec:
  data:
    - secretKey: GITLAB_READ_TOKEN
      remoteRef:
        key: gitlab_read_token
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: my-gitlab-secret-store
  target:
    creationPolicy: Owner
    # name it after the release (the chart's default secret name, printed by
    # the install NOTES) and no chart values are needed at all
    name: tokens-gitlab-token-expiry-exporter
# for any other target name, point the chart at it:
#   gitlab:
#     existingSecret: my-other-name
