# Complete ArgoCD Application consuming the chart from GHCR (OCI).
#
# While the GitHub repo is private its GHCR packages are too — register the
# registry once with a token that has the read:packages scope:
#   argocd repo add ghcr.io/xcloud-eu/charts --type helm --name xcloud-charts \
#     --enable-oci --username <anyone> --password <read:packages token>
# Once the repo is public, no credential is needed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-token-expiry-exporter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/xcloud-eu/charts
    chart: gitlab-token-expiry-exporter
    targetRevision: 0.4.0
    helm:
      valuesObject:
        gitlab:
          url: https://gitlab.example.com
          groups:
            - my-org
          # point at the Secret the ExternalSecret below produces (any name
          # works; without these two lines the chart expects a Secret named
          # after the release with key GITLAB_READ_TOKEN)
          existingSecret: gitlab-read-token
          existingSecretKey: token
        serviceMonitor:
          additionalLabels:
            release: kube-prometheus-stack
        prometheusRule:
          additionalLabels:
            release: kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# The token Secret, produced by external-secrets under a custom name. Apply it
# to the SAME namespace the Application deploys to; the chart values above
# reference it via gitlab.existingSecret / existingSecretKey.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-read-token
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: my-secret-store
  data:
    - secretKey: token          # key inside the resulting Secret
      remoteRef:
        key: gitlab_read_token  # name in your secret backend
  target:
    creationPolicy: Owner
    name: gitlab-read-token
